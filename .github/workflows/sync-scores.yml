name: Sync Golf Scores

on:
  schedule:
    # Every 10 minutes, Thursday–Sunday, 7am–9pm ET (11:00–01:00 UTC)
    # Cron runs in UTC. ET = UTC-4 (EDT). 7am ET = 11:00 UTC, 9pm ET = 01:00 UTC next day.
    #
    # GitHub Actions cron does not support day-of-week ranges natively, so we
    # use four separate schedules (Thu=4, Fri=5, Sat=6, Sun=0).
    - cron: "*/10 11-23 * * 4,5,6"   # Thu/Fri/Sat 11:00–23:50 UTC (7am–7:50pm ET)
    - cron: "*/10 0-1  * * 5,6,0"    # Fri/Sat/Sun 00:00–01:50 UTC (8pm–9:50pm ET prior day)
    - cron: "0 11-14  * * 1"          # Mon 11:00–14:00 UTC (7am–10am ET) — cleanup pass for Sunday finishers
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Sync scores
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -X GET "${{ secrets.APP_URL }}/api/scores/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)
          echo "HTTP status: $status"
          echo "$body" | jq . || echo "$body"
          if [ "$status" != "200" ]; then
            echo "Score sync failed with status $status"
            exit 1
          fi
